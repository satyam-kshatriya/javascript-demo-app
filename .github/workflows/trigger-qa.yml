name: Trigger QA Automation

on:
  push:
    branches:
      - main

jobs:
  trigger-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA Repository Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/satyam-kshatriya/playwright-js-cucumber-framework/dispatches \
          -d '{"event_type":"run-automation"}'
